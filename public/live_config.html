<!DOCTYPE html>
<html lang="en">

<head>
  <title>Configuration Page </title>
  <link rel="stylesheet" href="live_config.css">
</head>
<body>
  <div class="extension"> 
    <!--import extension helper library -->
  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <!-- basic form that allows streamer to select which WYR options --> 
    <form id = "form">
      <div style="display: flex;">
        <h1>Start a Vote</h1>
      </div>
      <div id = "form-div" class="form-div">
            <text id="helper-hint">Specify how long users have to submit their votes</text>
            <input type="number" min="0" max="120" step="1" id="voteDuration" name="voteDuration" placeholder="Max 120s">
      </div>
      <div id="form-submit" class="form-submit">
        <input id="start-button" type="submit" value="Start Vote">
        <input id="stop-button" type="submit" value="Stop Vote">
      </div>
    </form>
  </div>

  <!-- import config.js -->
  <script src="live_config.js" type="text/javascript"></script>
</body>

</html>
